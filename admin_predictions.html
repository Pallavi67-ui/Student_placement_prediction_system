<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prediction Results</title>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">


</head>


<body>


<nav class="navbar navbar-expand-lg">

<div class="container">

<a class="navbar-brand" href="/admin_dashboard">
Student Placement Portal
</a>


<div class="ms-auto">

<a href="/admin_dashboard" class="btn btn-primary">
Back Dashboard
</a>

</div>

</div>

</nav>



<div class="container mt-5">


<h2 class="text-center mb-5">
Student Prediction Results
</h2>



<div class="feature-card">


<div class="table-responsive">


<table class="table table-dark table-hover align-middle">


<thead>

<tr>

<th>Name</th>

<th>Register Number</th>

<th>Department</th>

<th>Prediction Score</th>

<th>Status</th>

<th>Date</th>

</tr>

</thead>



<tbody>


{% for p in predictions %}

<tr>

<td>{{p[1]}}</td>

<td>{{p[2]}}</td>

<td>{{p[3]}}</td>

<td>{{p[4]}}%</td>

<td>{{p[5]}}</td>

<td>{{p[6]}}</td>


</tr>


{% endfor %}


</tbody>


</table>


</div>


</div>


</div>


</body>

</html>
