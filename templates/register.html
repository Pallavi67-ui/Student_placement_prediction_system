<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0b1120;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .register-container {
            width: 100%;
            max-width: 600px;
            background: #111827;
            border: 1px solid rgba(245, 158, 11, 0.25);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 30px;
            color: #f59e0b;
            margin-bottom: 8px;
        }

        .register-header p {
            color: #9ca3af;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #e5e7eb;
            font-size: 14px;
            font-weight: 500;
        }

        .form-control,
        .form-select {
            width: 100%;
            padding: 13px 15px;
            border-radius: 10px;
            border: 1px solid #374151;
            background: #020617;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            outline: none;
            transition: 0.3s ease;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.12);
        }

        .form-select option {
            background: #111827;
            color: #ffffff;
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #111827;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 5px;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.25);
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #9ca3af;
            font-size: 14px;
        }

        .login-link a {
            color: #f59e0b;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .flash-message {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="register-header">
            <h1>Create Account</h1>
            <p>Register to start your placement preparation</p>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash-message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">

            <div class="form-group">
                <label for="regName">Full Name</label>
                <input
                    type="text"
                    id="regName"
                    name="fullname"
                    class="form-control"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="regRoll">Register Number</label>
                <input
                    type="text"
                    id="regRoll"
                    name="register_number"
                    class="form-control"
                    placeholder="Enter your register number"
                    required
                >
            </div>

            <div class="form-group">
                <label for="regDept">Department</label>

                <select
                    id="regDept"
                    name="department"
                    class="form-select"
                    required
                >
                    <option value="">Select Department</option>

                    <option value="Computer Science and Engineering">
                        Computer Science and Engineering
                    </option>

                    <option value="Information Technology">
                        Information Technology
                    </option>

                    <option value="Master of Computer Applications">
                        MCA
                    </option>

                    <option value="Bachelor of Computer Applications">
                        BCA
                    </option>

                    <option value="Computer Science">
                        B.Sc Computer Science
                    </option>

                    <option value="Artificial Intelligence & Data Science">
                        Artificial Intelligence & Data Science
                    </option>

                    <option value="Artificial Intelligence & Machine Learning">
                        Artificial Intelligence & Machine Learning
                    </option>

                    <option value="Cyber Security">
                        Cyber Security
                    </option>

                    <option value="Electronics and Communication">
                        Electronics and Communication
                    </option>

                    <option value="Electrical and Electronics Engineering">
                        Electrical and Electronics Engineering
                    </option>

                    <option value="Mechanical Engineering">
                        Mechanical Engineering
                    </option>

                    <option value="Civil Engineering">
                        Civil Engineering
                    </option>

                    <option value="Biotechnology">
                        Biotechnology
                    </option>

                    <option value="B.Com">
                        B.Com
                    </option>

                    <option value="BBA">
                        BBA
                    </option>

                    <option value="MBA">
                        MBA
                    </option>

                    <option value="M.Sc Computer Science">
                        M.Sc Computer Science
                    </option>

                    <option value="M.Sc Data Science">
                        M.Sc Data Science
                    </option>

                    <option value="Other">
                        Other Department
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="regEmail">Email</label>
                <input
                    type="email"
                    id="regEmail"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="regPassword">Password</label>
                <input
                    type="password"
                    id="regPassword"
                    name="password"
                    class="form-control"
                    placeholder="Create a password"
                    required
                >
            </div>

            <button type="submit" class="btn-register">
                Register
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </div>

    </div>

</body>
</html>
